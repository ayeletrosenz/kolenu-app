<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>תודה שהצבעתם! · קולנו</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="device">
    <span class="btn btn-power" aria-hidden="true"></span>
    <span class="btn btn-volume" aria-hidden="true"></span>
    <div class="device-bezel" style="--screen-edge: var(--sky)">
      <main class="screen received">
        <h1 class="received-title">תודה שהצבעתם!</h1>

        <!-- Illustration slot: swap the placeholder for <img src="assets/illustrations/…" alt="…"> once supplied. -->
        <div class="landing-art received-art">
          <div class="art-placeholder" aria-hidden="true"></div>
        </div>

        <p class="received-note">אפשר לשנות את ההצבעה עד סגירת הקלפיות.<br>רק ההצבעה האחרונה שתשלחו תיספר.</p>

        <footer class="footer landing-actions">
          <a class="secondary received-change" href="drafts/4-wheel.html">שינוי ההצבעה</a>
          <a class="primary" href="landing.html">סיום</a>
        </footer>
      </main>
      <div class="home-indicator" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    /* Changing the vote reopens the voting screen the summary came from, with the submitted choices still in the session. */
    const from = sessionStorage.getItem('kolenu.summaryFrom');
    if (from) document.querySelector('.received-change').href = from;
  </script>
</body>
</html>
